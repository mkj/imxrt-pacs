transforms:
  - !DeleteFieldsets
    from: .*
    useless: true
  - !DeleteEnums
    from: .*
    bit_size: 1
  # TODO
  # - !Rename
  #   from: flexio1
  #   to: flexio
  - !Rename
    from: flexio::Flexio1
    to: flexio::Flexio
  - !Rename
    from: flex_spi::(.*)
    to: flexspi::$1
  - !Rename
    from: (.*)::FlexSpi
    to: $1::Flexspi
  - !Rename
    from: lp(.*)1::(.*)
    to: lp$1::$2
  - !Rename
    from: lp(.*)::Lp(.*)1
    to: lp$1::Lp$1
  - !Rename
    from: adc1::(.*)
    to: adc::$1
  - !Rename
    from: adc::Adc1
    to: adc::Adc
  - !Rename
    from: gpt1::(.*)
    to: gpt::$1
  - !Rename
    from: gpt::Gpt1
    to: gpt::Gpt
  - !Rename
    from: pwm1::(.*)
    to: pwm::$1
  - !Rename
    from: pwm::Pwm1
    to: pwm::Pwm
  - !Rename
    from: wdog1::(.*)
    to: wdog::$1
  - !Rename
    from: wdog::Wdog1
    to: wdog::Wdog
  - !Rename
    from: dma0::(.*)
    to: dma::$1
  - !Rename
    from: dma::Dma0
    to: dma::Dma
  - !Rename
    from: gpio1::(.*)
    to: gpio::$1
  - !Rename
    from: gpio::Gpio1
    to: gpio::Gpio

  - !MakeRegisterArray
    blocks: gpio::Gpio
    from: icr\d+
    to: icr_x


  - !MergeFieldsets
    from: gpio::regs::Icr(\d+)
    to: gpio::regs::Icr
    check: NoCheck

  - !MakeFieldArray
    fieldsets: gpio::regs::Icr
    from: icr\d+
    to: pin

  - !MergeEnums
    from: gpio::vals::Icr\d+
    to: gpio::vals::Icr


  # USB
  #- !MakeFieldArray
  #  fieldsets: usb::regs::Endptsetupstat
  #  from: endptsetupstat
  #  to: endptsetupstat
  #  offset: 1

  - !MergeFieldsets
    from: flexspi::regs::Ahbrxbuf\d+cr0
    to: flexspi::regs::AhbrxbufCr0
    check: NoCheck

  - !MakeRegisterArray
    blocks: flexspi::Flexspi
    from: ahbrxbuf\d+cr0
    to: ahbrxbufcr0

  - !MergeFieldsets
    from: usb::regs::Endptctrl\d+
    to: usb::regs::EndptctrlX
    check: NoCheck

  - !MakeRegisterArray
    blocks: usb::Usb
    from: endptctrl\d+
    to: endptctrl_x

  # DMA
  - !MergeEnums
    from: dma::vals::Tcd\d+([^\d]*)
    to: dma::vals::Tcd$1

  - !DeleteEnums
    from: dma::vals::TcdAttrSmod

  - !MergeFieldsets
    from: dma::regs::Dchpri\d+
    to: dma::regs::DchpriX
    check: NoCheck

  - !MakeRegisterArray
    blocks: dma::Dma
    from: dchpri\d+
    to: dchpri_x

  - !MakeBlock
    blocks: dma::Dma
    from: tcd(\d+)_(.*)
    to_block: dma::Tcd
    to_outer: tcd$1
    to_inner: $2

  - !MakeRegisterArray
    blocks: dma::Dma
    from: tcd\d+
    to: tcd_x

  - !MakeFieldArray
    fieldsets: dma::regs::Int
    from: int\d+
    to: int

  - !MakeFieldArray
    fieldsets: dma::regs::Err
    from: err\d+
    to: err

  - !MakeFieldArray
    fieldsets: dma::regs::Erq
    from: erq\d+
    to: erq

  - !MakeFieldArray
    fieldsets: dma::regs::Hrs
    from: hrs\d+
    to: hrs

  - !MergeFieldsets
    from: dma::regs::Tcd\d+([^\d]*)
    to: dma::regs::Tcd$1
    check: NoCheck

  - !RenameEnumVariants
    enum: iomuxc::vals::GpioDse
    from: (DSE_[^_]*)_.*
    to: $1

  # - !DeleteDuplicateEnumFields
  #   from: .*

  - !Sanitize

      #- !MergeFieldsets
      #  from: dma::regs::Tcd(\d+)attr
      #  to: dma::regs::TcdAttr

